[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS background service: inbox monitoring, sender validation, AI drafting, and notifications."
readme = "README.md"
authors = [
    { name = "dharamveersingh", email = "dharamveer.singh@virima.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
agentos = "agentos.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
